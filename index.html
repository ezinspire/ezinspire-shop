<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZINSPIRE | L'Atelier Haute Beauté</title>
    <!-- High-Fashion Serif & Linear Fonts -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pearly-aurora-glow"></div>
    <header id="mainHeader">
        <a href="#" class="brand-logo">EZINSPIRE</a>
        <div class="nav-wing-right"><span class="bag-label-minimal">Maison Bag</span><span class="bag-count-circle" id="bagCount">0</span></div>
    </header>

    <main>
        <section class="celestial-hero">
            <div class="hero-image-veil-back" id="heroBg"></div>
            <div class="hero-central-theatre">
                <h1 class="fade-up-lux">Liquid Luxury.<br><span class="fluid-serif">Sensory Intimacy.</span></h1>
                <p class="hero-abstract-manifesto fade-up-lux delay-2">Artistic, rare, and avant-garde.</p>
                <button class="celestial-action-btn" id="exploreBtn">Enter The Vault</button>
            </div>
        </section>

        <section class="product-canvas" id="curations">
            <div class="asymmetric-gallery-web">
                <article class="luxury-artifact-card scroll-reveal">
                    <div class="museum-frame"><img src="https://unsplash.com" alt="Peel Shot"></div>
                    <div class="artifact-editorial-details"><h3>Resurfacing Peel Shot</h3><button class="acquire-specimen-trigger">Acquire</button></div>
                </article>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
