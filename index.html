<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZINSPIRE | L'Atelier Haute Beauté</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cosmetic-grain-canvas"></div>
    <header id="mainHeader">
        <a href="#" class="brand-logo">EZINSPIRE</a>
        <nav class="luxury-megamenu">
            <ul>
                <li><a href="#lookbook">The Lookbook</a></li>
                <li><a href="#skincare">Skincare Lab</a></li>
                <li><a href="#fragrance">Haute Perfumery</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="theatre-hero-section">
            <div class="hero-editorial-grid">
                <div class="hero-text-block">
                    <h1 class="cinematic-headline">Liquid Luxury.<br><span class="editorial-italic">Sensory Intimacy.</span></h1>
                    <p class="hero-narrative-paragraph">Advanced cellular biotechnology meets architectural fragrance design.</p>
                </div>
                <div class="hero-visual-block scroll-reveal">
                    <img src="https://unsplash.com" alt="Luxury Visual">
                </div>
            </div>
        </section>
        <section class="collection-canvas-grid" id="skincare">
            <div class="editorial-asymmetric-products-web">
                <article class="artifact-display-node scroll-reveal">
                    <img src="https://unsplash.com" alt="Product">
                    <h3>Resurfacing Peel Shot</h3>
                    <p>£75.00</p>
                    <button>Acquire Specimen</button>
                </article>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
