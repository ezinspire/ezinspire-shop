<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZINSPIRE | L'Atelier Haute Cosmétique</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@100;200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="mainHeader">
        <a href="#" class="brand-logo">EZINSPIRE</a>
        <nav class="desktop-nav">
            <ul>
                <li><a href="#exhibition" class="nav-link">The Lookbook</a></li>
                <li><a href="#curations" class="nav-link">The Collection</a></li>
            </ul>
        </nav>
        <div class="cart-indicator-wrap" id="cartTrigger">
            <span class="bag-txt">Maison Bag</span>
            <div class="bag-counter-node">(<span id="bagCount">0</span>)</div>
        </div>
    </header>

    <main>
        <section class="cinematic-stage">
            <h1>Liquid Luxury.</h1>
            <p>Biotechnology encapsulated within heavy stained-white glass.</p>
        </section>

        <section class="product-canvas" id="curations">
            <h2>The Curated Specimen Shells</h2>
            <div class="asymmetric-editorial-web">
                <article class="artifact-node">
                    <img src="https://unsplash.com" alt="Resurfacing Peel Shot">
                    <h3>Resurfacing Peel Shot</h3>
                    <span class="price-node">£75.00</span>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>EZINSPIRE © 2024</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
