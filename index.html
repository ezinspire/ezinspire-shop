<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZINSPIRE | L'Atelier Innovation</title>
   
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="mainHeader">
        <a href="#" class="brand-logo">EZINSPIRE</a>
        <nav><ul><li>The Exhibition</li><li>The Collection</li></ul></nav>
        <div class="cart-indicator">Bag (<span id="bagCount">0</span>)</div>
    </header>

    <main>
    
        <section class="cinematic-hero">
            <div class="hero-overlay-card">
                <h1>Liquid Luxury.<br>Sensory Intimacy.</h1>
                <p>Innovative skincare and perfumery.</p>
                <button class="luxury-action-btn">Explore</button>
            </div>
        </section>

        <section class="product-canvas" id="curations">
            <div class="overlapping-grid">
                <article class="product-node scroll-reveal">
                    <div class="cinematic-frame"><img src="skin-product.jpg" alt="Peel Shots"></div>
                    <h3>Resurfacing Peel Shot</h3>
                    <button class="bag-action-trigger">Acquire</button>
                </article>
                <article class="product-node offset-node scroll-reveal">
                    <div class="cinematic-frame"><img src="perfume.jpg" alt="Oud"></div>
                    <h3>Oud Infusion N°910</h3>
                    <button class="bag-action-trigger">Acquire</button>
                </article>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
